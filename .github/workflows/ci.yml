name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout (submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests (Catch2)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: pluginval (strictness level 5)
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "KoeNote.vst3" -Directory | Select-Object -First 1
          if (-not $vst3) { throw "KoeNote.vst3 が見つかりません" }
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process --output-dir pluginval-logs --validate $vst3.FullName

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: KoeNote-vst3-windows-x64
          path: build/src/plugin/KoeNote_artefacts/Release/VST3/KoeNote.vst3

      # インストーラーの定義（installer/KoeNote.iss）が壊れていないことを、リリース前に確認する
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=0.0.0-ci" "/DSourceRoot=$PWD" "/DVst3Dir=$PWD\build\src\plugin\KoeNote_artefacts\Release\VST3\KoeNote.vst3" "/O$PWD\dist" installer\KoeNote.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC が失敗しました" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KoeNote-installer-windows-x64
          path: dist/*.exe

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: ignore
