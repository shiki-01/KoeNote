name: Release

# v で始まるタグ（例: v0.1.0）を push すると、ビルド・テストの後に zip とインストーラーを作り、
# GitHub Releases に下書き（draft）として置く。内容を確認してから、GitHub の画面で公開する。
# 手動実行（workflow_dispatch）では、CMakeLists.txt のバージョンで同じ手順を通し、Releases は作らずに
# zip とインストーラーを Actions の成果物（artifact）として置く（リリース前の試運転用）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout (submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(KoeNote VERSION ([0-9.]+)') { throw "CMakeLists.txt のバージョンが読めません" }
          $version = $Matches[1]
          if ("${{ github.ref_type }}" -eq "tag") {
            # CMakeLists.txt の project(... VERSION x.y.z) とタグを一致させる
            $tagVersion = "${{ github.ref_name }}".TrimStart('v')
            if ($tagVersion -ne $version) { throw "タグ ($tagVersion) と CMakeLists.txt のバージョン ($version) が一致しません" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests (Catch2)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (zip)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = "dist/KoeNote-$version-windows-x64"
          New-Item -ItemType Directory -Force "$stage/docs" | Out-Null
          Copy-Item -Recurse build/src/plugin/KoeNote_artefacts/Release/VST3/KoeNote.vst3 "$stage/"
          Copy-Item LICENSE "$stage/LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md, README.md "$stage/"
          Copy-Item docs/user-guide.md, docs/neural-setup.md "$stage/docs/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/KoeNote-$version-windows-x64.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$version" "/DSourceRoot=$PWD" "/DVst3Dir=$PWD\build\src\plugin\KoeNote_artefacts\Release\VST3\KoeNote.vst3" "/O$PWD\dist" installer\KoeNote.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC が失敗しました" }

      - name: Upload artifacts (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: KoeNote-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe

      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create "${{ github.ref_name }}" --draft --title "KoeNote $version" --generate-notes `
            "dist/KoeNote-$version-windows-x64.zip" "dist/KoeNote-$version-windows-x64-setup.exe"
